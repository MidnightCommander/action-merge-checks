name: CI

permissions:
  contents: read

on: [ push ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - run: uv sync --dev

      - run: uv run ruff check

      - run: uv run ruff format --diff

      - run: uv run pytest
