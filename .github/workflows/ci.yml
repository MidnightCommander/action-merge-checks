name: CI

permissions:
  contents: read

on: [ push ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - run: uv sync --dev

      - run: uv run ruff check

      - run: uv run ruff format --diff

      - run: uv run pytest
